---
title: Harshit Varma | Blog
layout: default
---

<div class="container-fluid mb-3 text-content fill-page">

  <div class="col-md-8 mx-auto mt-5">

    <div class="h2 font-weight-light m-0 p-0 mb-4">
      Blog
    </div>

    {% if site.posts.size == 0 %}
      <div class="text-light">Nothing here yet.</div>
    {% endif %}

    <ul class="post-list">
      {% for post in site.posts %}
        <li class="post-item">
          <code class="post-date text-light">{{ post.date | date: "%b %d, %Y" }}</code>
          <div>
            <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
            {% if post.description %}
              <div class="post-description text-light">{{ post.description }}</div>
            {% endif %}
          </div>
        </li>
      {% endfor %}
    </ul>

  </div>

</div>
