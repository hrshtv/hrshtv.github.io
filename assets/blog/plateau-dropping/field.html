}

}

}
* { box-sizing: border-box; }
body {

main { max-width: 1080px; margin: 0 auto; padding-block: 40px 36px; display: grid; gap: 20px; }
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
h1 { font-size: 28px; line-height: 1.1; margin: 0 0 6px; letter-spacing: -0.02em; font-weight: 700; text-wrap: balance; }

.visit { text-align: right; font-variant-numeric: tabular-nums; }

.visit .rule { display: block; color: var(--muted); font-size: 13px; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--bg); touch-action: none; cursor: grab; }
.stage:active { cursor: grabbing; }
.stage canvas { display: block; width: 100%; height: 100%; }
.stage .hint { position: absolute; right: 12px; bottom: 10px; font-size: 12px; color: var(--muted); pointer-events: none; }

.stage .axis.title { font: 500 12px var(--sans); color: var(--ink); opacity: .78; }
.share { display: grid; gap: 8px; }
.share .labels { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; gap: 4px 16px; }
.share .labels .live { color: rgb(var(--accent)); font-weight: 600; }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--faint); }
.bar span { transition: width .35s ease; }
.bar .live { background: rgb(var(--accent)); }
.bar .learned { background: var(--learned); }
.bar .stuck { background: var(--stuck); }
footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; }
footer .note { min-width: 0; max-width: 72ch; }
.controls { display: flex; align-items: center; gap: 10px; }
.controls button { font: 500 13px var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--faint); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
.controls button:hover { border-color: var(--muted); }
.controls button:focus-visible, .controls input:focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; }
.controls input[type=range] { width: 170px; accent-color: rgb(var(--accent)); }
.pick { display: grid; gap: 12px; }
.ex { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.ex button { font: 500 13px var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--faint); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.ex button[aria-pressed="true"] { border-color: rgb(var(--accent)); color: rgb(var(--accent)); }
.ex button:focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; }
.ex .stats { margin-left: 6px; font-variant-numeric: tabular-nums; }
.turn { display: flex; flex-wrap: wrap; gap: 4px 3px; font: 13px/1 var(--mono); min-width: 0; }
.turn span { padding: 5px 4px; border-radius: 4px; white-space: pre; transition: background-color .3s, color .3s; }
.turn .learned { background: var(--learned); color: var(--muted); }
.turn .stuck { background: var(--stuck); color: var(--ink); }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; padding: 24px; text-align: center; }
/* Embedded in the blog post: the post supplies the title, caption and side gutters, matches the site background,

:root { --bg: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #181818; } }
:root[data-theme="dark"] { --bg: #181818; }
html, body { margin: 0; }
body { padding-left: 0; padding-right: 0; }
main { padding-block: 0 4px; }
header { justify-content: flex-end; }

@media (min-width: 600px) {

  header .visit { text-shadow: 0 0 4px var(--bg), 0 0 8px var(--bg), 0 0 12px var(--bg); }
}

  const sun = new THREE.DirectionalLight(0xffffff, 0.66); sun.position.set(-25, 40, 30); scene.add(sun);
  const fill = new THREE.DirectionalLight(0xffffff, 0.22); fill.position.set(30, 12, -25); scene.add(fill);

  const groundMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(W + 3, D + 3), groundMat);
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.01; scene.add(ground);

  const N = TOKS * VISITS;
  const geo = new THREE.BoxGeometry(0.76, 1, GZ * 0.8); geo.translate(0, 0.5, 0);
  const mesh = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ roughness: 0.6, metalness: 0 }), N);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(mesh);
  const dummy = new THREE.Object3D(), col = new THREE.Color();
  const heights = new Float32Array(N), cols = Array.from({ length: N }, () => new THREE.Color());

  const palette = {};
  const axisMat = new THREE.LineBasicMaterial({ color: 0x888888 });
  function readTheme() {
    const cs = getComputedStyle(document.documentElement), get = k => cs.getPropertyValue(k).trim();
    const rgb = get("--accent").split(/\s+/).map(Number);
    palette.accent = new THREE.Color(rgb[0] / 255, rgb[1] / 255, rgb[2] / 255);
    palette.bg = new THREE.Color(get("--bg"));
    palette.learned = new THREE.Color(get("--learned"));
    palette.stuck = new THREE.Color(get("--stuck"));
    palette.pale = palette.bg.clone().lerp(palette.accent, 0.35);
    renderer.setClearColor(palette.bg); groundMat.color.set(get("--ground")); axisMat.color.set(get("--muted"));
    scene.fog = new THREE.Fog(palette.bg, 80, 150);
  }
  readTheme();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readTheme);
  new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  function targetColor(i, j, out) {
    const s = STATE[i][j];
    if (s === 1) return out.copy(palette.learned);
    if (s === 2) return out.copy(palette.stuck);
    return out.copy(palette.pale).lerp(palette.accent, Math.min(LOSS[i][j] / 2.2, 1));
  }
  // rows up to the current visit stand at their loss; the next row grows in as the visit advances
  function place(p, k) {
    for (let j = 0; j < VISITS; j++) {
      const grow = j <= Math.floor(p) ? 1 : j === Math.ceil(p) ? p - Math.floor(p) : 0;
      for (let i = 0; i < TOKS; i++) {
        const n = j * TOKS + i;
        heights[n] += (Math.max(LOSS[i][j], 0.025) * HS * grow - heights[n]) * k;
        dummy.position.set(xAt(i), 0, zAt(j));
        dummy.scale.set(1, Math.max(heights[n], 1e-4), heights[n] > 0.004 ? 1 : 1e-4);
        dummy.updateMatrix(); mesh.setMatrixAt(n, dummy.matrix);
        targetColor(i, j, col); cols[n].lerp(col, k); mesh.setColorAt(n, cols[n]);
      }
    }
    mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true;
  }
  for (let i = 0; i < TOKS; i++) for (let j = 0; j < VISITS; j++) targetColor(i, j, cols[j * TOKS + i]);
  place(pos, 1);
  onExample = () => { heights.fill(0); };

  // axes from the front-left corner: tokens to the right, visits toward the viewer, loss up
  const O = new THREE.Vector3(xAt(0) - 1.4, 0, zAt(VISITS - 1) + 1.6), YTOP = 8.6;
  const segs = [], seg = (a, b) => segs.push(a, b), V = (x, y, z) => new THREE.Vector3(x, y, z);
  seg(O, V(xAt(TOKS - 1) + 0.6, 0, O.z));
  seg(V(O.x, 0, zAt(0) - 0.6), O);
  seg(O, V(O.x, YTOP * HS, O.z));
  const TX = [1, 12, 24, 36, 48], TZ = [1, 3, 5, 7, 9], TY = [0, 2, 4, 6, 8];
  TX.forEach(t => seg(V(xAt(t - 1), 0, O.z), V(xAt(t - 1), 0, O.z + 0.6)));
  TZ.forEach(v => seg(V(O.x, 0, zAt(v - 1)), V(O.x - 0.6, 0, zAt(v - 1))));
  TY.forEach(y => seg(V(O.x, y * HS, O.z), V(O.x - 0.5, y * HS, O.z + 0.5)));
  scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(segs), axisMat));
  const labels = [];
  const label = (text, p, cls = "") => {
    const el = document.createElement("div"); el.className = "axis " + cls; el.textContent = text; stage.append(el);
    labels.push({ el, p });
  };
  TX.forEach(t => label(String(t), V(xAt(t - 1), 0, O.z + 1.8)));
  TZ.forEach(v => label(String(v), V(O.x - 1.8, 0, zAt(v - 1))));
  TY.forEach(y => label(String(y), V(O.x - 1.4, y * HS, O.z + 1.4)));
  label("Token position in the turn →", V(0, 0, O.z + 3.9), "title");
  label("Visit", V(O.x - 5.6, 0, 0), "title");
  label("Loss (nats) ↑", V(O.x - 1.4, (YTOP + 0.35) * HS, O.z + 1.4), "title");
  const proj = new THREE.Vector3();
  function placeLabels() {
    const w = stage.clientWidth, h = stage.clientHeight;
    for (const { el, p } of labels) {
      proj.copy(p).project(camera);
      el.hidden = proj.z > 1 || Math.abs(proj.x) > 1.05 || Math.abs(proj.y) > 1.05;
      el.style.transform = `translate(${((proj.x + 1) / 2 * w).toFixed(1)}px, ${((1 - proj.y) / 2 * h).toFixed(1)}px) translate(-50%, -50%)`;
    }
  }

  // camera: slow orbit around the front, drag to rotate (yaw) and tilt (pitch)
  let yaw = -0.5, pitch = 0.52, dragging = false, lx = 0, ly = 0, lastDrag = -1e9, dir = 1;
  const RADIUS = 66;
  stage.addEventListener("pointerdown", e => { dragging = true; lx = e.clientX; ly = e.clientY; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener("pointermove", e => {
    if (!dragging) return;
    yaw -= (e.clientX - lx) * 0.006; pitch = Math.min(1.3, Math.max(0.12, pitch + (e.clientY - ly) * 0.004));
    lx = e.clientX; ly = e.clientY; lastDrag = performance.now();
  });
  const release = () => { dragging = false; };
  stage.addEventListener("pointerup", release); stage.addEventListener("pointercancel", release);

  // the stage shows only the lower CROP of a 16:9 view: the band above the tallest bars is mostly empty
  const CROP = 0.8;
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight, full = h / CROP;
    renderer.setSize(w, h, false); camera.aspect = w / full;
    camera.fov = w / full < 1.2 ? 44 : 30;
    camera.setViewOffset(w, full, 0, full - h, w, h); camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage); resize();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(now - last, 64); last = now;
    if (playing) { pos = posAt(now - t0); scrub.value = pos; }
    place(pos, 1 - Math.exp(-dt / 80));
    renderHud(pos);
    if (!reduced && !dragging && now - lastDrag > 2500) {   // sway between front-left and front-right views
      yaw += dt * 0.00006 * dir;
      if (yaw > 0.55) dir = -1; else if (yaw < -0.75) dir = 1;
    }
    camera.position.set(Math.sin(yaw) * Math.cos(pitch) * RADIUS, Math.sin(pitch) * RADIUS * 0.85 + 3, Math.cos(yaw) * Math.cos(pitch) * RADIUS);
    camera.lookAt(0, 2.0, 0);
    renderer.render(scene, camera);
    placeLabels();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

scrub.value = pos;
play.textContent = playing ? "Pause" : "Play";
play.addEventListener("click", () => {
  playing = !playing; play.textContent = playing ? "Pause" : "Play";
  if (playing) { const p = +scrub.value; t0 = performance.now() - (TIMING.hold + Math.floor(p) * (TIMING.step + TIMING.hold) + (p % 1) * TIMING.step); }
});
scrub.addEventListener("input", () => { playing = false; play.textContent = "Play"; pos = +scrub.value; });
</script>
<script>
// When embedded, size the iframe to the content so it has no inner scrollbar at any width.
try {
  if (window.frameElement) {
    const fit = () => { frameElement.style.height = Math.ceil(document.body.getBoundingClientRect().height) + "px"; };
    new ResizeObserver(fit).observe(document.body); fit();
  }
} catch (e) {}
</script>
</body>
</html>
